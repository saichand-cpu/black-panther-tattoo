<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Black Panther Studio</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <script src="https://kit.fontawesome.com/a2d9d5a54a.js" crossorigin="anonymous"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      overflow-x: hidden;
      background: #000;
      color: #fff;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background: url('image.jpeg') center/cover no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      padding: 60px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 600px;
      animation: fadeUp 1.5s ease;
    }

    .content h5 {
      letter-spacing: 3px;
      font-weight: 300;
      opacity: 0.8;
    }

    .content h1 {
      font-size: 80px;
      font-weight: 800;
      line-height: 0.9;
    }

    .content h1 span {
      display: block;
      color: #fff;
      animation: slideIn 1.2s ease;
    }

    /* LOGO */
    .logo {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 70px;
      opacity: 0.9;
      animation: float 3s ease-in-out infinite;
    }

    /* FLOATING BUTTONS */
    .floating {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: flex;
      gap: 15px;
    }

    .btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.2);
      background: #fff;
      color: #000;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from {opacity: 0; transform: translateY(40px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @keyframes slideIn {
      from {transform: translateX(-100px); opacity: 0;}
      to {transform: translateX(0); opacity: 1;}
    }

    @keyframes float {
      0%,100% {transform: translateY(0);}
      50% {transform: translateY(-10px);}
    }

    /* SCROLL SECTION */
    .section {
      padding: 100px 60px;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      margin-top: 30px;
      transition: 0.4s;
    }

    .card:hover {
      transform: translateY(-10px);
      background: rgba(255,255,255,0.1);
    }

  </style>
</head>

<body>

  <div class="hero">
    <div class="overlay"></div>

    <!-- LOGO -->
    <img src="blackpantherlogo-removebg-preview.png" class="logo" />

    <!-- TEXT -->
    <div class="content">
      <h5>WELCOME TO</h5>
      <h1>
        <span>BLACK</span>
        <span>PANTHER</span>
      </h1>
    </div>

    <!-- FLOATING BUTTONS -->
    <div class="floating">
      <div class="btn" onclick="openInsta()"><i class="fab fa-instagram"></i></div>
      <div class="btn" onclick="openWhatsApp()"><i class="fab fa-whatsapp"></i></div>
      <div class="btn" onclick="openMap()"><i class="fas fa-map-marker-alt"></i></div>
    </div>
  </div>

  <!-- SECOND SECTION -->
  <div class="section">
    <h2>Our Services</h2>

    <div class="card">Tattoo Design</div>
    <div class="card">Custom Artwork</div>
    <div class="card">Premium Studio Experience</div>
  </div>

  <script>
    // BUTTON LINKS
    <div class="float-buttons">
<a href="https://wa.me/917981366211" class="whatsapp" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<a href="https://maps.app.goo.gl/XkbrmcTRJiC8i32o8" class="maps" target="_blank">
<i class="fas fa-map-marker-alt"></i>
</a>

<a href="https://www.instagram.com/kungfumartialartsacademy02?igsh=YXc0bm92ODlnMWpw" class="instagram" target="_blank">
<i class="fab fa-instagram"></i>
</a>
</div>
<footer>
© 2026 black panther tattoz
</footer>

<script>
function sendWhatsApp(){
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let msg = document.getElementById("message").value;

    let url = "https://wa.me/917981366211?text="
    + "New Admission Request:%0A"
    + "Name: " + name + "%0A"
    + "Phone: " + phone + "%0A"
    + "Message: " + msg;

    window.open(url, '_blank');


    // SCROLL ANIMATION
    window.addEventListener("scroll", () => {
      document.querySelectorAll(".card").forEach((el) => {
        let pos = el.getBoundingClientRect().top;
        let screen = window.innerHeight;

        if (pos < screen - 100) {
          el.style.opacity = 1;
          el.style.transform = "translateY(0)";
        }
      });
    });
  </script>

</body>
</html>
