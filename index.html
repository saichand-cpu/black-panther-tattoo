<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Black Panther Studio</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a2d9d5a54a.js" crossorigin="anonymous"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background: url('image.jpeg') center/cover no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      padding: 60px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
    }

    .content {
      position: relative;
      z-index: 2;
      animation: fadeUp 1.5s ease;
    }

    .content h5 {
      letter-spacing: 3px;
      opacity: 0.8;
    }

    .content h1 {
      font-size: 70px;
      font-weight: 800;
      line-height: 0.9;
    }

    .content span {
      display: block;
      animation: slideIn 1s ease;
    }

    /* LOGO */
    .logo {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 70px;
      animation: float 3s ease-in-out infinite;
    }

    /* FLOAT BUTTONS */
    .float-buttons {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 999;
    }

    .float-buttons a {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      text-decoration: none;
      transition: 0.3s;
    }

    .whatsapp { background: #25D366; }
    .maps { background: #EA4335; }
    .instagram { background: #E1306C; }

    .float-buttons a:hover {
      transform: scale(1.2);
    }

    /* SECTION */
    .section {
      padding: 100px 60px;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      margin-top: 30px;
      transition: 0.4s;
      opacity: 0;
      transform: translateY(40px);
    }

    .card:hover {
      transform: translateY(-10px);
      background: rgba(255,255,255,0.1);
    }

    footer {
      text-align: center;
      padding: 20px;
      opacity: 0.6;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from {opacity: 0; transform: translateY(40px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @keyframes slideIn {
      from {transform: translateX(-100px); opacity: 0;}
      to {transform: translateX(0); opacity: 1;}
    }

    @keyframes float {
      0%,100% {transform: translateY(0);}
      50% {transform: translateY(-10px);}
    }

  </style>
</head>

<body>

  <div class="hero">
    <div class="overlay"></div>

    <!-- LOGO -->
    <img src="blackpantherlogo-removebg-preview.png" class="logo" />

    <!-- TEXT -->
    <div class="content">
      <h5>WELCOME TO</h5>
      <h1>
        <span>BLACK</span>
        <span>PANTHER</span>
      </h1>
    </div>
  </div>

  <!-- FLOAT BUTTONS -->
  <div class="float-buttons">
    <a href="https://wa.me/917981366211" class="whatsapp" target="_blank">
      <i class="fab fa-whatsapp"></i>
    </a>

    <a href="https://maps.app.goo.gl/XkbrmcTRJiC8i32o8" class="maps" target="_blank">
      <i class="fas fa-map-marker-alt"></i>
    </a>

    <a href="https://www.instagram.com/kungfumartialartsacademy02" class="instagram" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>
  </div>

  <!-- SERVICES -->
  <div class="section">
    <h2>Our Services</h2>

    <div class="card">Tattoo Design</div>
    <div class="card">Custom Artwork</div>
    <div class="card">Premium Studio Experience</div>
  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 Black Panther Tattooz
  </footer>

  <!-- SCRIPT -->
  <script>
    window.addEventListener("scroll", () => {
      document.querySelectorAll(".card").forEach((el) => {
        let pos = el.getBoundingClientRect().top;
        let screen = window.innerHeight;

        if (pos < screen - 100) {
          el.style.opacity = 1;
          el.style.transform = "translateY(0)";
        }
      });
    });
  </script>

</body>
</html>
